<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nour Al-Bayan - Page 35</title>
    <link rel="stylesheet" href="../shared/core.css">
</head>
<body class="flex flex-col items-center select-none bg-emerald-50/40">
    <script>
        window.PAGE_CONFIG = {
            title: 'Nour Al-Bayan',
            subtitle: 'Page 35 • Small Sillah Waw (الواو الصغيرة والصلة)',
            footer: 'Nour Al-Bayan Learning System • Page 35 (Small Sillah Waw (الواو الصغيرة والصلة))',
            game3: 'riddles'
        };

        const rawWords = [
            // Row 1
            "<span class='c-black'>وُ</span><span class='c-red'>ۥ</span><span class='c-black'>رِ</span><span class='c-red'>ىَ</span>",
            "<span class='c-black'>دَ</span><span class='c-red'>ا</span><span class='c-black'>وُ</span><span class='c-red'>ۥ</span><span class='c-black'>دُ</span>",
            "<span class='c-black'>لَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>مَ</span><span class='c-red'>ا</span> <span class='c-black'>فِ</span><span class='c-red'>ى</span>",
            "<span class='c-black'>مَعَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>فِ</span><span class='c-red'>ى</span>",
            
            // Row 2
            "<span class='c-black'>خَلَقَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>وَبَدَأَ</span>",
            "<span class='c-black'>قَرِ</span><span class='c-red'>ي</span><span class='c-black'>نُهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>هَـ</span><span class='c-red'>ٰ</span><span class='c-black'>ذَ</span><span class='c-red'>ا</span>",
            "<span class='c-black'>فَوَكَزَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>مُ</span><span class='c-red'>و</span><span class='c-black'>سَـ</span><span class='c-red'>ٰ</span><span class='c-black'>ى</span>",
            
            // Row 3
            "<span class='c-black'>بَرَزُ</span><span class='c-red'>و</span><span class='c-black'>اْ لِجَ</span><span class='c-red'>ا</span><span class='c-black'>لُ</span><span class='c-red'>و</span><span class='c-black'>تَ وَجُنُ</span><span class='c-red'>و</span><span class='c-black'>دِهِ</span><span class='c-red'>ۦ</span>",
            "<span class='c-black'>وَقَتَلَ دَ</span><span class='c-red'>ا</span><span class='c-black'>وُ</span><span class='c-red'>ۥ</span><span class='c-black'>دُ جَ</span><span class='c-red'>ا</span><span class='c-black'>لُ</span><span class='c-red'>و</span><span class='c-black'>تَ</span>",
            
            // Row 4
            "<span class='c-black'>وَحَبِطَ مَ</span><span class='c-red'>ا</span> <span class='c-black'>صَنَعُ</span><span class='c-red'>و</span><span class='c-black'>اْ فِ</span><span class='c-red'>ي</span><span class='c-black'>هَ</span><span class='c-red'>ا</span>",
            "<span class='c-black'>أُ</span><span class='c-red'>و</span><span class='c-black'>تِ</span><span class='c-red'>ىَ</span> <span class='c-black'>كِتَـ</span><span class='c-red'>ٰ</span><span class='c-black'>بَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>بِيَمِ</span><span class='c-red'>ي</span><span class='c-black'>نِهِ</span><span class='c-red'>ۦ</span>",
            
            // Row 5
            "<span class='c-black'>وَكَ</span><span class='c-red'>ا</span><span class='c-black'>نُ</span><span class='c-red'>و</span><span class='c-black'>اْ لَنَ</span><span class='c-red'>ا</span> <span class='c-black'>خَـ</span><span class='c-red'>ٰ</span><span class='c-black'>شِعِ</span><span class='c-red'>ي</span><span class='c-black'>نَ</span>",
            "<span class='c-black'>قَ</span><span class='c-red'>ا</span><span class='c-black'>لُ</span><span class='c-red'>و</span><span class='c-black'>اْ هَـ</span><span class='c-red'>ٰ</span><span class='c-black'>ذَ</span><span class='c-red'>ا</span> <span class='c-black'>مَ</span><span class='c-red'>ا</span> <span class='c-black'>وَعَدَنَ</span><span class='c-red'>ا</span>",
            
            // Row 6
            "<span class='c-black'>فَقَعُ</span><span class='c-red'>و</span><span class='c-black'>اْ لَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>سَـ</span><span class='c-red'>ٰ</span><span class='c-black'>جِدِ</span><span class='c-red'>ي</span><span class='c-black'>نَ</span>",
            "<span class='c-black'>مَ</span><span class='c-red'>ا</span><span class='c-black'>لُهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>وَوَلَدُهُ</span><span class='c-red'>ۥ</span>",
            
            // Row 7
            "<span class='c-black'>تَكُ</span><span class='c-red'>و</span><span class='c-black'>نُ لَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>عَـ</span><span class='c-red'>ٰ</span><span class='c-black'>قِبَةُ</span>",
            "<span class='c-black'>لَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>بِرَ</span><span class='c-red'>ٰ</span><span class='c-black'>زِقِ</span><span class='c-red'>ي</span><span class='c-black'>نَ</span>",
            
            // Row 8
            "<span class='c-black'>وَخَرَقُ</span><span class='c-red'>و</span><span class='c-black'>اْ لَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>بَنِ</span><span class='c-red'>ي</span><span class='c-black'>نَ</span>",
            "<span class='c-black'>قَ</span><span class='c-red'>ا</span><span class='c-black'>لَ لَهُ</span><span class='c-red'>ۥ</span> <span class='c-black'>صَ</span><span class='c-red'>ا</span><span class='c-black'>حِبُهُ</span><span class='c-red'>ۥ</span>"
        ];

        // Apply Red Color dynamically to ALL Tashkeel and Small Letters
        // Range \u064B-\u0653 captures all Arabic Harakat (Fatha, Damma, Kasra, Sukoon, etc.)
        // \u0670 is Small Alif (ٰ), \u06E5 is Small Waw (ۥ), \u06E6 is Small Yaa (ۦ)
        const processedWords = rawWords.map(wordHTML => {
            return wordHTML.replace(/([\u064B-\u0653\u0670\u06E5\u06E6])/g, "<span class='c-red'>$1</span>");
        });

        const typesArr = ['normal', 'speed', 'normal', 'danger', 'normal', 'golden', 'normal', 'speed'];
        const themesArr = ['pink', 'green', 'blue', 'yellow'];
        
        const dataset = processedWords.map((wordHTML, index) => {
            return {
                w: `<span class='quran-special-font' dir="rtl">${wordHTML}</span>`,
                info: "Madd of Sillah",
                theme: themesArr[index % themesArr.length],
                t: typesArr[index % typesArr.length]
            };
        });
    </script>
    <script src="../shared/core.js"></script>
</body>
</html>
