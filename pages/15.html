<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نور البيان - صفحة 15</title>
    <link rel="stylesheet" href="../shared/core.css">
</head>
<body class="flex flex-col items-center select-none bg-emerald-50/40">
    <script>
        window.PAGE_CONFIG = {
            title: 'نور البيان',
            subtitle: 'حركة الكسر — كلمات مدمجة ومجمعة',
            lessonNumber: 3,
            pageNumber: 15,
            fontType: 'dictation',
            game3: 'memory'
        };

        const _themes = ["pink","green","blue","yellow"];
        const _raw = [
            // الأسطر 1–4: مقطع ثنائي متصل في الصندوق الأول + حرف ثالث في الصندوق الثاني
            [[[["ضَـ",0],["ـحِـ",1]],[["ـكَ",2]]],"normal"],
            [[[["مَـ",0],["ـرِ",1]],[["حَ",2]]],"speed"],
            [[[["عَـ",0],["ـمِـ",1]],[["ـلَ",2]]],"normal"],
            [[[["عَـ",0],["ـقِـ",1]],[["ـلَ",2]]],"normal"],
            [[[["حَـ",0],["ـيِـ",1]],[["ـيَ",2]]],"danger"],
            [[[["غَـ",0],["ـضِـ",1]],[["ـبَ",2]]],"normal"],
            [[[["خَـ",0],["ـجِـ",1]],[["ـلَ",2]]],"golden"],
            [[[["جَـ",0],["ـهِـ",1]],[["ـلَ",2]]],"normal"],
            [[[["أَ",0],["ذِ",1]],[["نَ",2]]],"normal"],
            [[[["أَ",0],["لِـ",1]],[["ـفَ",2]]],"normal"],
            [[[["صَـ",0],["ـحِـ",1]],[["ـبَ",2]]],"speed"],
            [[[["عَـ",0],["ـنِـ",1]],[["ـتَ",2]]],"normal"],
            [[[["شَـ",0],["ـعِـ",1]],[["ـثَ",2]]],"normal"],
            [[[["رَ",0],["قِـ",1]],[["ـبَ",2]]],"danger"],
            [[[["دَ",0],["كِـ",1]],[["ـنَ",2]]],"normal"],
            [[[["صَـ",0],["ـئِـ",1]],[["ـبَ",2]]],"golden"],

            // الأسطر 5–8: 16 كلمة مجمعة في صندوق واحد (الكسرة باللون الأحمر)
            [[[["كَـ",2],["ـئِـ",0],["ـبَ",2]]],"normal"],
            [[[["بَـ",2],["ـشِـ",0],["ـمَ",2]]],"normal"],
            [[[["خَـ",2],["ـصِـ",0],["ـبَ",2]]],"speed"],
            [[[["دَ",2],["سِـ",0],["ـمَ",2]]],"normal"],
            [[[["صَـ",2],["ـدِ",0],["ئَ",2]]],"danger"],
            [[[["نَـ",2],["ـضِـ",0],["ـجَ",2]]],"normal"],
            [[[["قَـ",2],["ـضِـ",0],["ـمَ",2]]],"normal"],
            [[[["لَـ",2],["ـظِـ",0],["ـيَ",2]]],"golden"],
            [[[["نَـ",2],["ـغِـ",0],["ـصَ",2]]],"normal"],
            [[[["لَـ",2],["ـغِـ",0],["ـبَ",2]]],"speed"],
            [[[["نَـ",2],["ـيِـ",0],["ـلَ",2]]],"normal"],
            [[[["دَ",2],["هِـ",0],["ـشَ",2]]],"normal"],
            [[[["جَـ",2],["ـنِـ",0],["ـفَ",2]]],"danger"],
            [[[["دَ",2],["فِـ",0],["ئَ",2]]],"normal"],
            [[[["ظَـ",2],["ـمِـ",0],["ئَ",2]]],"normal"],
            [[[["بَـ",2],["ـرِ",0],["ئَ",2]]],"golden"]
        ];
        const dataset = _raw.map((r,i)=>({
            boxes: r[0],
            t: r[1],
            theme: _themes[Math.floor(i/4)%4],
            w: r[0].map(b => b.map(s=>s[0]).join('')).join('')
        }));
    </script>
    <script src="../shared/core.js"></script>
</body>
</html>
