<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nour Al-Bayan - Page 18</title>
    <link rel="stylesheet" href="../shared/core.css">
</head>
<body class="flex flex-col items-center select-none bg-emerald-50/40">
    <script>
window.PAGE_CONFIG = {
            title: 'نور البيان',
            subtitle: '٣ـ الحروف بحركة الضم — المقارنات الثنائية والثلاثية',
            lessonNumber: 1,
            pageNumber: 18,
            fontType: 'dictation',
            game3: 'memory'
        };

        const D = "<span class='sep-bar mx-1'>-</span>";
        const dataset = [
            // الجزء الأول: الحروف بحركة الضم مفردة
            {w: [`<span class='c-red'>أُ</span>`], t: "normal"},
            {w: [`<span class='c-blue'>بُـ</span>`], t: "speed"},
            {w: [`<span class='c-emerald'>تُـ</span>`], t: "normal"},
            {w: [`<span class='c-black'>ثُـ</span>`], t: "golden"},
            {w: [`<span class='c-red'>جُـ</span>`], t: "normal"},
            {w: [`<span class='c-blue'>حُـ</span>`], t: "danger"},
            {w: [`<span class='c-emerald'>خُـ</span>`], t: "normal"},
            {w: [`<span class='c-black'>دُ</span>`], t: "speed"},
            {w: [`<span class='c-red'>ذُ</span>`], t: "normal"},
            {w: [`<span class='c-blue'>رُ</span>`], t: "golden"},

            // الجزء الثاني: مقارنات الحركات الثلاث
            {w: [`<span class='c-red'>زَ</span>${D}<span class='c-blue'>زِ</span>${D}<span class='c-emerald'>زُ</span>`], t: "normal"},
            {w: [`<span class='c-red'>سَـ</span>${D}<span class='c-blue'>سِـ</span>${D}<span class='c-emerald'>سُـ</span>`], t: "speed"},
            {w: [`<span class='c-emerald'>شَـ</span>${D}<span class='c-blue'>شِـ</span>${D}<span class='c-red'>شُـ</span>`], t: "danger"},
            {w: [`<span class='c-red'>صَـ</span>${D}<span class='c-blue'>صِـ</span>${D}<span class='c-emerald'>صُـ</span>`], t: "normal"},
            {w: [`<span class='c-emerald'>ضَـ</span>${D}<span class='c-blue'>ضِـ</span>${D}<span class='c-red'>ضُـ</span>`], t: "golden"},
            {w: [`<span class='c-red'>طَـ</span>${D}<span class='c-blue'>طِـ</span>${D}<span class='c-emerald'>طُـ</span>`], t: "normal"},
            {w: [`<span class='c-emerald'>ظَـ</span>${D}<span class='c-blue'>ظِـ</span>${D}<span class='c-red'>ظُـ</span>`], t: "speed"},
            {w: [`<span class='c-red'>عَـ</span>${D}<span class='c-blue'>عِـ</span>${D}<span class='c-emerald'>عُـ</span>`], t: "danger"},
            {w: [`<span class='c-emerald'>غَـ</span>${D}<span class='c-blue'>غِـ</span>${D}<span class='c-red'>غُـ</span>`], t: "normal"},
            {w: [`<span class='c-red'>فَـ</span>${D}<span class='c-blue'>فِـ</span>${D}<span class='c-emerald'>فُـ</span>`], t: "golden"},
            {w: [`<span class='c-red'>قَـ</span>${D}<span class='c-blue'>قُـ</span>${D}<span class='c-emerald'>قِـ</span>`], t: "normal"},
            {w: [`<span class='c-red'>كَـ</span>${D}<span class='c-blue'>كُـ</span>${D}<span class='c-emerald'>كِـ</span>`], t: "speed"},
            {w: [`<span class='c-emerald'>لُـ</span>${D}<span class='c-blue'>لَـ</span>${D}<span class='c-red'>لِـ</span>`], t: "danger"},
            {w: [`<span class='c-red'>مِـ</span>${D}<span class='c-blue'>مُـ</span>${D}<span class='c-emerald'>مَـ</span>`], t: "normal"},
            {w: [`<span class='c-red'>نَـ</span>${D}<span class='c-blue'>نُـ</span>${D}<span class='c-emerald'>نِـ</span>`], t: "golden"},
            {w: [`<span class='c-red'>هُـ</span>${D}<span class='c-blue'>هَـ</span>${D}<span class='c-emerald'>هِـ</span>`], t: "normal"},
            {w: [`<span class='c-red'>وَ</span>${D}<span class='c-blue'>وُ</span>${D}<span class='c-emerald'>وِ</span>`], t: "speed"},
            {w: [`<span class='c-red'>يَـ</span>${D}<span class='c-blue'>يُـ</span>${D}<span class='c-emerald'>يِـ</span>`], t: "normal"}
        ];
        const _themes = ["pink","green","blue","yellow"];
        dataset.forEach((item, i) => {
            item.theme = _themes[Math.floor(i/4) % 4];
            if (!item.html) {
                if (item.w.length === 1) item.html = item.w[0];
                else item.html = item.w.map((s,j) => `<span class="color-${j%3}">${s}</span>`).join('');
            }
        });
    </script>
    <script src="../shared/core.js"></script>
</body>
</html>
